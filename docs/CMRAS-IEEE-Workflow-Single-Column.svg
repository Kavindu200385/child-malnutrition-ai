<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="7.2in" viewBox="0 0 700 1440" role="img" aria-labelledby="title desc">
  <title id="title">CMRAS system workflow for an IEEE single-column paper</title>
  <desc id="desc">Simplified workflow for the Child Malnutrition Risk Assessment System.</desc>
  <defs>
    <style>
      .box{fill:#fff;stroke:#1f2937;stroke-width:2.4;rx:12}.clinical{fill:#ecfdf5;stroke:#047857;stroke-width:2.6;rx:12}.ai{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2.6;rx:12}.warning{fill:#fff7ed;stroke:#c2410c;stroke-width:2.6;rx:12}.secure{fill:#f8fafc;stroke:#475569;stroke-width:2.4;rx:12}.head{font:700 25px Arial,sans-serif;fill:#111827}.body{font:400 20px Arial,sans-serif;fill:#374151}.label{font:700 19px Arial,sans-serif;fill:#4b5563}.arrow{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.branch{fill:none;stroke:#64748b;stroke-width:2.8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker>
  </defs>
  <rect width="700" height="1440" fill="#fff"/>

  <rect class="box" x="75" y="35" width="550" height="105"/>
  <text x="350" y="77" text-anchor="middle" class="head">Authenticated User Access</text>
  <text x="350" y="110" text-anchor="middle" class="body">OTP, role, and area-based authorization</text>
  <path class="arrow" d="M350 140V185"/>

  <rect class="box" x="75" y="185" width="550" height="125"/>
  <text x="350" y="228" text-anchor="middle" class="head">Role-Based Child Care</text>
  <text x="350" y="262" text-anchor="middle" class="body">Hospital registration - PHM monitoring</text>
  <text x="350" y="291" text-anchor="middle" class="body">MOH review - Nutritionist referral</text>
  <path class="arrow" d="M350 310V355"/>

  <rect class="box" x="75" y="355" width="550" height="145"/>
  <text x="350" y="398" text-anchor="middle" class="head">Measurement Entry and Validation</text>
  <text x="350" y="432" text-anchor="middle" class="body">Required: age, sex, weight, height</text>
  <text x="350" y="462" text-anchor="middle" class="body">Optional: MUAC and edema</text>
  <text x="350" y="488" text-anchor="middle" class="body">Date, range, and gender validation</text>

  <path class="branch" d="M350 500V545H195V575M350 545H505V575"/>
  <path class="arrow" d="M195 545V575M505 545V575"/>
  <text x="350" y="536" text-anchor="middle" class="label">PARALLEL ASSESSMENT</text>

  <rect class="clinical" x="45" y="575" width="300" height="215"/>
  <text x="195" y="617" text-anchor="middle" class="head">WHO Clinical Status</text>
  <text x="195" y="650" text-anchor="middle" class="body">WFA: underweight</text>
  <text x="195" y="680" text-anchor="middle" class="body">HFA: stunting</text>
  <text x="195" y="710" text-anchor="middle" class="body">WFH/WFL: wasting</text>
  <text x="195" y="744" text-anchor="middle" class="body">Rule-based current status</text>
  <text x="195" y="774" text-anchor="middle" class="label">CLINICAL ASSESSMENT</text>

  <rect class="ai" x="355" y="575" width="300" height="215"/>
  <text x="505" y="617" text-anchor="middle" class="head">Existing AI Model</text>
  <text x="505" y="642" text-anchor="middle" class="body">Current and simulated</text>
  <text x="505" y="669" text-anchor="middle" class="body">previous growth</text>
  <text x="505" y="696" text-anchor="middle" class="body">measurements</text>
  <text x="505" y="723" text-anchor="middle" class="body">2-month predicted risk</text>
  <text x="505" y="750" text-anchor="middle" class="body">Confidence score and warning</text>
  <text x="505" y="779" text-anchor="middle" class="label">EARLY WARNING ONLY</text>

  <path class="branch" d="M195 790V830H350M505 790V830H350"/>
  <path class="arrow" d="M350 830V865"/>

  <rect class="warning" x="75" y="865" width="550" height="145"/>
  <text x="350" y="908" text-anchor="middle" class="head">Clinical Decision Support</text>
  <text x="350" y="942" text-anchor="middle" class="body">Current status and future risk remain separate</text>
  <text x="350" y="970" text-anchor="middle" class="body">Edema, severe status, or low-confidence</text>
  <text x="350" y="998" text-anchor="middle" class="body">prediction triggers clinical review and escalation</text>
  <path class="arrow" d="M350 1010V1055"/>

  <rect class="secure" x="75" y="1055" width="550" height="140"/>
  <text x="350" y="1098" text-anchor="middle" class="head">Secure Storage and Audit</text>
  <text x="350" y="1132" text-anchor="middle" class="body">Encrypted sensitive healthcare data</text>
  <text x="350" y="1162" text-anchor="middle" class="body">Audit-safe decision metadata without raw PII</text>
  <path class="arrow" d="M350 1195V1240"/>

  <rect class="box" x="75" y="1240" width="550" height="125"/>
  <text x="350" y="1283" text-anchor="middle" class="head">Reporting and Follow-Up</text>
  <text x="350" y="1317" text-anchor="middle" class="body">Child profile, growth history, and dashboards</text>
  <text x="350" y="1347" text-anchor="middle" class="body">Repeat assessment at the next clinic visit</text>
  <path class="arrow" d="M625 1303H675V428H625"/>
</svg>
